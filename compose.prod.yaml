services:
  odoo:
    command:
      - odoo
      - --database=${ODOO_DB_NAME:-repka}
      - --db-filter=^${ODOO_DB_NAME:-repka}$$
      - --workers=${ODOO_WORKERS:-2}
      - --max-cron-threads=${ODOO_MAX_CRON_THREADS:-1}
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "5"

  db:
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "5"

  caddy:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    depends_on:
      odoo:
        condition: service_healthy
    environment:
      ODOO_DOMAIN: ${ODOO_DOMAIN:?Set ODOO_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - frontend
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "5"
    security_opt:
      - no-new-privileges:true

volumes:
  caddy-data:
  caddy-config:
